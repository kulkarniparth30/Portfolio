<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d884f8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5a189a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241442" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#120824" stop-opacity="0.95"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c770f0" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7b2cbf" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0c0513" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="300" cy="240" r="220" fill="url(#halo)" />

  <!-- Neural Network Mesh in Background -->
  <g opacity="0.45" stroke="#be6adf" stroke-width="1.5">
    <line x1="80" y1="120" x2="180" y2="70" stroke-dasharray="3,3"/>
    <line x1="180" y1="70" x2="300" y2="90"/>
    <line x1="300" y1="90" x2="420" y2="60"/>
    <line x1="420" y1="60" x2="520" y2="110" stroke-dasharray="3,3"/>
    <line x1="180" y1="70" x2="220" y2="160"/>
    <line x1="300" y1="90" x2="300" y2="170"/>
    <line x1="420" y1="60" x2="380" y2="160"/>
    <line x1="220" y1="160" x2="380" y2="160"/>
    <line x1="80" y1="120" x2="130" y2="210"/>
    <line x1="520" y1="110" x2="470" y2="210"/>
  </g>

  <!-- Neural Network Nodes -->
  <g filter="url(#neonBlur)">
    <circle cx="80" cy="120" r="7" fill="#00f5d4"/>
    <circle cx="180" cy="70" r="9" fill="#c770f0"/>
    <circle cx="300" cy="90" r="11" fill="#e0aaff"/>
    <circle cx="420" cy="60" r="9" fill="#c770f0"/>
    <circle cx="520" cy="110" r="7" fill="#00f5d4"/>
    <circle cx="220" cy="160" r="8" fill="#9d4edd"/>
    <circle cx="300" cy="170" r="10" fill="#c770f0"/>
    <circle cx="380" cy="160" r="8" fill="#9d4edd"/>
    <circle cx="130" cy="210" r="6" fill="#7b2cbf"/>
    <circle cx="470" cy="210" r="6" fill="#7b2cbf"/>
  </g>

  <!-- Floating AI Badges -->
  <g transform="translate(70, 240)">
    <rect width="85" height="32" rx="16" fill="#1b1233" stroke="#c770f0" stroke-width="1.5" opacity="0.9"/>
    <text x="42.5" y="21" fill="#e0aaff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" text-anchor="middle">⚡ RAG</text>
  </g>
  <g transform="translate(440, 220)">
    <rect width="95" height="32" rx="16" fill="#1b1233" stroke="#c770f0" stroke-width="1.5" opacity="0.9"/>
    <text x="47.5" y="21" fill="#00f5d4" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" text-anchor="middle">🧠 LLMs</text>
  </g>
  <g transform="translate(420, 310)">
    <rect width="115" height="32" rx="16" fill="#1b1233" stroke="#9d4edd" stroke-width="1.5" opacity="0.9"/>
    <text x="57.5" y="21" fill="#e0aaff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" text-anchor="middle">🤖 LangGraph</text>
  </g>

  <!-- Desk & Holographic Workspace -->
  <!-- Desk Base Shadow -->
  <ellipse cx="300" cy="450" rx="220" ry="25" fill="#090412" opacity="0.8"/>
  <!-- Work Desk -->
  <path d="M 120 440 L 480 440 L 450 455 L 150 455 Z" fill="#2d1950" stroke="#7b2cbf" stroke-width="1"/>

  <!-- Left Hologram Screen (Neural Architecture & Loss Curve) -->
  <g transform="rotate(-6 190 320)">
    <rect x="130" y="220" width="130" height="90" rx="8" fill="url(#screenGrad)" stroke="#c770f0" stroke-width="1.5"/>
    <!-- Screen Header -->
    <circle cx="145" cy="232" r="3" fill="#ff5f56"/>
    <circle cx="155" cy="232" r="3" fill="#ffbd2e"/>
    <circle cx="165" cy="232" r="3" fill="#27c93f"/>
    <!-- Loss Curve -->
    <path d="M 145 295 Q 165 285, 185 260 T 245 245" fill="none" stroke="#00f5d4" stroke-width="2.5"/>
    <text x="145" y="250" fill="#a588c0" font-family="monospace" font-size="9">loss: 0.0142</text>
    <text x="145" y="262" fill="#a588c0" font-family="monospace" font-size="9">val_acc: 98.7%</text>
  </g>

  <!-- Right Hologram Screen (Agentic Workflow / Code) -->
  <g transform="rotate(6 410 320)">
    <rect x="340" y="220" width="130" height="90" rx="8" fill="url(#screenGrad)" stroke="#c770f0" stroke-width="1.5"/>
    <!-- Screen Header -->
    <circle cx="355" cy="232" r="3" fill="#ff5f56"/>
    <circle cx="365" cy="232" r="3" fill="#ffbd2e"/>
    <circle cx="375" cy="232" r="3" fill="#27c93f"/>
    <!-- Code Lines -->
    <line x1="355" y1="248" x2="430" y2="248" stroke="#c770f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="355" y1="258" x2="400" y2="258" stroke="#00f5d4" stroke-width="2" stroke-linecap="round"/>
    <line x1="365" y1="268" x2="445" y2="268" stroke="#e0aaff" stroke-width="2" stroke-linecap="round"/>
    <line x1="365" y1="278" x2="420" y2="278" stroke="#9d4edd" stroke-width="2" stroke-linecap="round"/>
    <line x1="355" y1="288" x2="390" y2="288" stroke="#00f5d4" stroke-width="2" stroke-linecap="round"/>
    <!-- Status Tag -->
    <rect x="410" y="285" width="48" height="15" rx="4" fill="#623686"/>
    <text x="434" y="296" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- Center Developer / AI Engineer -->
  <!-- Chair Back -->
  <rect x="270" y="310" width="60" height="110" rx="12" fill="#170c2e" stroke="#5a189a" stroke-width="2"/>

  <!-- Body / Torso (Hoodie with Purple Accents) -->
  <path d="M 260 380 Q 300 365 340 380 L 355 450 L 245 450 Z" fill="#2d1950" stroke="#7b2cbf" stroke-width="2"/>
  <!-- Hoodie Collar / V-neck -->
  <path d="M 285 375 L 300 405 L 315 375 Z" fill="#3c1e6d"/>

  <!-- Head & Hair -->
  <circle cx="300" cy="335" r="26" fill="#f1c0a0"/>
  <!-- Modern Hair -->
  <path d="M 276 332 C 274 315, 290 305, 305 306 C 322 307, 328 318, 324 330 C 318 318, 292 318, 276 332 Z" fill="#2b1a38"/>
  <!-- Headphone Band -->
  <path d="M 272 335 C 272 312, 328 312, 328 335" fill="none" stroke="#be6adf" stroke-width="4" stroke-linecap="round"/>
  <!-- Headphone Ear Cups -->
  <rect x="268" y="330" width="8" height="15" rx="4" fill="#00f5d4"/>
  <rect x="324" y="330" width="8" height="15" rx="4" fill="#00f5d4"/>

  <!-- Glowing Central Laptop -->
  <g transform="translate(255, 385)">
    <!-- Screen Base & Lid -->
    <polygon points="0,45 90,45 80,10 10,10" fill="#1b1030" stroke="#c770f0" stroke-width="1.5"/>
    <polygon points="5,43 85,43 76,14 14,14" fill="#3a1d63"/>
    <!-- Glowing AI Brain Logo on Laptop Back/Screen -->
    <circle cx="45" cy="27" r="7" fill="#00f5d4" opacity="0.9" filter="url(#neonBlur)"/>
    <!-- Laptop Base Keyboard Body -->
    <path d="M -8 45 L 98 45 L 90 52 L 0 52 Z" fill="#4a257a" stroke="#be6adf" stroke-width="1"/>
  </g>

  <!-- Glowing Particles around developer -->
  <g filter="url(#neonBlur)">
    <circle cx="210" cy="360" r="2.5" fill="#00f5d4"/>
    <circle cx="390" cy="370" r="3" fill="#c770f0"/>
    <circle cx="280" cy="260" r="2" fill="#e0aaff"/>
    <circle cx="320" cy="250" r="2.5" fill="#00f5d4"/>
    <circle cx="240" cy="180" r="3" fill="#be6adf"/>
    <circle cx="360" cy="190" r="2.5" fill="#e0aaff"/>
  </g>
</svg>
