  <text x="425" y="88" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#c084fc">📊 Visual Skill-Gap Matrix</text>

  <g transform="translate(425, 110)">
    <!-- Skill 1 -->
    <text x="0" y="16" font-family="monospace" font-size="11" fill="#ffffff">LangGraph &amp; Multi-Agent Systems</text>
    <rect x="0" y="24" width="330" height="12" rx="6" fill="#2d124d"/>
    <rect x="0" y="24" width="310" height="12" rx="6" fill="#10b981"/>
    <text x="315" y="20" font-family="monospace" font-size="9" fill="#34d399">94%</text>

    <!-- Skill 2 -->
    <text x="0" y="58" font-family="monospace" font-size="11" fill="#ffffff">FastAPI &amp; REST Microservices</text>
    <rect x="0" y="66" width="330" height="12" rx="6" fill="#2d124d"/>
    <rect x="0" y="66" width="295" height="12" rx="6" fill="#10b981"/>
    <text x="315" y="62" font-family="monospace" font-size="9" fill="#34d399">90%</text>

    <!-- Skill 3 -->
    <text x="0" y="100" font-family="monospace" font-size="11" fill="#ffffff">RAG &amp; Vector Databases</text>
    <rect x="0" y="108" width="330" height="12" rx="6" fill="#2d124d"/>
    <rect x="0" y="108" width="280" height="12" rx="6" fill="#10b981"/>
    <text x="315" y="104" font-family="monospace" font-size="9" fill="#34d399">85%</text>

    <!-- Skill 4 (Gap) -->
    <text x="0" y="142" font-family="monospace" font-size="11" fill="#ffffff">Kubernetes / Distributed Orchestration</text>
    <rect x="0" y="150" width="330" height="12" rx="6" fill="#2d124d"/>
    <rect x="0" y="150" width="120" height="12" rx="6" fill="#ef4444"/>
    <text x="315" y="146" font-family="monospace" font-size="9" fill="#f87171">36%</text>

    <!-- Paper Note -->
    <rect x="0" y="180" width="330" height="120" rx="6" fill="#1f0a35" stroke="#a855f7" stroke-width="1"/>
    <text x="14" y="205" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#00f5d4">📝 Research Publication</text>
    <text x="14" y="226" font-family="monospace" font-size="9.5" fill="#f1f5f9">"AI-Powered Career Diagnostics and</text>
    <text x="14" y="240" font-family="monospace" font-size="9.5" fill="#f1f5f9">Resume Enhancement System"</text>
    <text x="14" y="260" font-family="monospace" font-size="9" fill="#a78bfa">Co-authored paper (Currently under peer review)</text>
    <text x="14" y="280" font-family="monospace" font-size="9" font-weight="bold" fill="#f472b6">Features: ATS NLP, Hallucination Auditing</text>
  </g>
