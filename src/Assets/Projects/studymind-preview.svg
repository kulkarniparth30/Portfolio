  <rect x="275" y="152" width="465" height="32" rx="6" fill="#132b38" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="290" y="172" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="600">🔍 RAG Retrieval: 3 Chunks (Cosine Sim: 0.884, 0.862) from CS402_Distributed_Sys.pdf#p42</text>

  <!-- Streaming Assistant Response -->
  <rect x="275" y="194" width="465" height="150" rx="8" fill="#170c2e" stroke="#6b21a8" stroke-width="0.8"/>
  <text x="290" y="214" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="700">STUDYMIND AI (In-Browser WebGPU Streaming)</text>
  <text x="290" y="233" fill="#e2d9ee" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11">The Two-Phase Commit (2PC) guarantees all-or-nothing atomicity across distributed nodes:</text>
  
  <text x="300" y="254" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10.5">1. Prepare Phase: Coordinator sends PREPARE. Cohorts execute locally &amp; vote VOTE_COMMIT.</text>
  <text x="300" y="272" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10.5">2. Commit Phase: If all agree, coordinator logs GLOBAL_COMMIT; otherwise broadcasts ABORT.</text>
  <text x="300" y="290" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10">📌 Verified Citation: CS402_Distributed_Sys.pdf · Section 8.3 "Consensus &amp; Transaction Protocols"</text>

