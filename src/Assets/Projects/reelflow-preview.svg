  <!-- Uploaded Media Strips -->
  <rect x="270" y="118" width="470" height="60" rx="8" fill="#1b092b" stroke="#7e22ce" stroke-width="0.8"/>
  <text x="282" y="136" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="700">IMAGE SEQUENCER &amp; TIMINGS</text>
  
  <rect x="282" y="144" width="90" height="26" rx="4" fill="#3b0764"/>
  <text x="288" y="161" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9">Img 1 (2.5s) · Fade</text>

  <rect x="380" y="144" width="95" height="26" rx="4" fill="#3b0764"/>
  <text x="386" y="161" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9">Img 2 (3.0s) · Zoom</text>

  <rect x="483" y="144" width="95" height="26" rx="4" fill="#3b0764"/>
  <text x="489" y="161" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9">Img 3 (2.8s) · Slide</text>

  <rect x="586" y="144" width="95" height="26" rx="4" fill="#3b0764"/>
  <text x="592" y="161" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9">Img 4 (3.2s) · KenB</text>

  <!-- Voiceover & Soundtrack Track -->
  <rect x="270" y="188" width="470" height="65" rx="8" fill="#1b092b" stroke="#7e22ce" stroke-width="0.8"/>
  <text x="282" y="206" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="700">AUDIO SYNTHESIS &amp; DUCKING</text>
  <text x="282" y="224" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10">🗣️ AI Voiceover: Google Text-to-Speech (gTTS) · Natural Cadence</text>
  <text x="282" y="242" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10">🎵 Background Music: Synthwave Drive · Volume Ducked automatically during speech</text>

  <!-- FFmpeg Progress Bar & Render Status -->
  <rect x="270" y="263" width="470" height="80" rx="8" fill="#170624" stroke="#d946ef" stroke-width="1"/>
  <text x="282" y="283" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="700">FFmpeg Multi-Pass Render Queue</text>
  <text x="630" y="283" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="700">● 100% Complete</text>

  <!-- Progress Bar Track -->
  <rect x="282" y="295" width="446" height="12" rx="6" fill="#2d103b"/>
  <rect x="282" y="295" width="446" height="12" rx="6" fill="url(#accentOrange)"/>

  <text x="282" y="326" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9.5">Video Codec: libx264 · Audio Codec: aac (192kbps) · Filter: zoompan=z='min(zoom+0.0015,1.25)'</text>

  <!-- Bottom CTA Actions -->
  <rect x="270" y="355" width="225" height="38" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="0.8"/>
  <text x="285" y="378" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="600">⚡ Render Time: 4.8 Seconds</text>

  <rect x="510" y="355" width="230" height="38" rx="6" fill="url(#accentOrange)"/>
  <text x="532" y="378" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="700">🎬 Generate New Reel (Free)</text>
</svg>