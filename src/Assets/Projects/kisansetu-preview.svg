<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ksBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1715"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="0" y="0" width="800" height="480" rx="12" fill="url(#ksBg)" stroke="#10b981" stroke-width="2"/>
  
  <!-- Titlebar -->
  <rect x="0" y="0" width="800" height="42" rx="12" fill="#0d1f1c"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <text x="400" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">KisanSetu — Agentic Multimodal AI Platform [Dual-Tier Diagnostic Engine]</text>

  <!-- Left Column: Multimodal Image Diagnostic Feed -->
  <rect x="24" y="60" width="350" height="395" rx="8" fill="#0b1714" stroke="#047857" stroke-width="1.2"/>
  <text x="44" y="88" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#10b981">🌿 Crop Pathology Vision Input</text>

  <!-- Image Simulation Card -->
  <g transform="translate(44, 105)">
    <rect x="0" y="0" width="310" height="180" rx="6" fill="#06221c" stroke="#10b981" stroke-width="1"/>
    <!-- Leaf Diagnostic Graphic -->
    <path d="M 50 140 C 60 50, 150 30, 260 50 C 220 120, 160 160, 50 140 Z" fill="url(#leafGrad)" opacity="0.6"/>
    <!-- Bounding Box / Lesion Detection -->
    <rect x="110" y="65" width="70" height="50" rx="4" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="112" y="60" font-family="monospace" font-size="10" font-weight="bold" fill="#f87171">Blight Lesion [98.4%]</text>

    <!-- ResNet50 Badge -->
    <rect x="180" y="145" width="120" height="24" rx="4" fill="#064e3b"/>
    <text x="240" y="161" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">ResNet50 Offline Fallback</text>
  </g>

  <!-- Diagnosis Metrics -->
  <g transform="translate(44, 305)">
    <rect x="0" y="0" width="310" height="130" rx="6" fill="#061f19" stroke="#047857" stroke-width="1"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff">Disease: Early Blight (Alternaria solani)</text>
    <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6ee7b7">Multimodal Cloud Path: Gemini 2.5 Flash</text>
    <text x="14" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a7f3d0">Offline Edge Path: ResNet50 (Latency: 28ms)</text>
    <text x="14" y="84" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">RAG Grounding: Verified Agri-Extension DB</text>
    <text x="14" y="106" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34d399">✓ Zero Hallucinated Advice (Strict RAG)</text>
  </g>

  <!-- Right Column: RAG Pipeline + Twilio IVR Layer -->
  <rect x="395" y="60" width="380" height="395" rx="8" fill="#0c1220" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="415" y="88" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#60a5fa">☁️ Cloud Deployment &amp; Multilingual IVR</text>

  <!-- Twilio Voice IVR card -->
  <g transform="translate(415, 105)">
    <rect x="0" y="0" width="340" height="110" rx="6" fill="#111d33" stroke="#2563eb" stroke-width="1"/>
    <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#38bdf8">📞 Multilingual Twilio Voice Call Bridge</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93c5fd">Target: Non-smartphone, regional language farmers</text>
    <text x="14" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#bfdbfe">Speech-to-Text &gt; RAG Query &gt; Audio Synthesis</text>
    <text x="14" y="92" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34d399">Languages: Marathi, Hindi, English</text>
  </g>

  <!-- GCP Container Stack -->
  <g transform="translate(415, 230)">
    <rect x="0" y="0" width="340" height="205" rx="6" fill="#080e1a" stroke="#1e3a8a" stroke-width="1"/>
    <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#a78bfa">☸️ GCP Architecture Stack</text>
    <text x="14" y="52" font-family="monospace" font-size="10" fill="#cbd5e1">• Google Cloud Run (Containerized FastAPI)</text>
    <text x="14" y="74" font-family="monospace" font-size="10" fill="#cbd5e1">• Vector DB &amp; LangChain Embeddings Store</text>
    <text x="14" y="96" font-family="monospace" font-size="10" fill="#cbd5e1">• Gemini 2.5 Flash Multimodal Endpoint</text>
    <text x="14" y="118" font-family="monospace" font-size="10" fill="#cbd5e1">• ResNet50 PyTorch TorchScript weights</text>
    <rect x="14" y="135" width="310" height="50" rx="4" fill="#13271f"/>
    <text x="24" y="156" font-family="monospace" font-size="10" font-weight="bold" fill="#10b981">⚡ Edge + Cloud Fallback Latency: &lt; 250ms</text>
    <text x="24" y="172" font-family="monospace" font-size="9" fill="#a7f3d0">Quantized PyTorch ResNet-50 weights with zero-loss fallback</text>
  </g>
</svg>
